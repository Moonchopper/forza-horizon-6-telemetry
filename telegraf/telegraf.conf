# Forza Horizon 6 telemetry pipeline.
# Receives the fixed 324-byte FH6 "Data Out" UDP packet, parses it declaratively
# with the binary parser, and fans out to InfluxDB (history) + Grafana Live (real-time).

[agent]
  # Flush quickly so Grafana Live feels real-time. 100ms => ~10Hz dashboard updates.
  interval = "100ms"
  flush_interval = "100ms"
  round_interval = false
  metric_batch_size = 1000
  metric_buffer_limit = 100000
  omit_hostname = true

###############################################################################
#                                   INPUT                                     #
###############################################################################

[[inputs.socket_listener]]
  service_address = "udp://:5300"
  read_buffer_size = "64KiB"
  data_format = "binary"
  endianness = "le"

  [[inputs.socket_listener.binary]]
    metric_name = "forza"
    # Sequential read of the 324-byte packet. Order == on-wire order; offsets are
    # implicit by accumulation. See docs/design.md for the verified offset table.
    entries = [
      { name = "is_race_on",                    type = "int32"   },
      { name = "timestamp_ms",                  type = "uint32"  },
      { name = "engine_max_rpm",                type = "float32" },
      { name = "engine_idle_rpm",               type = "float32" },
      { name = "current_engine_rpm",            type = "float32" },
      { name = "acceleration_x",                type = "float32" },
      { name = "acceleration_y",                type = "float32" },
      { name = "acceleration_z",                type = "float32" },
      { name = "velocity_x",                    type = "float32" },
      { name = "velocity_y",                    type = "float32" },
      { name = "velocity_z",                    type = "float32" },
      { name = "angular_velocity_x",            type = "float32" },
      { name = "angular_velocity_y",            type = "float32" },
      { name = "angular_velocity_z",            type = "float32" },
      { name = "yaw",                           type = "float32" },
      { name = "pitch",                         type = "float32" },
      { name = "roll",                          type = "float32" },
      { name = "norm_suspension_travel_fl",     type = "float32" },
      { name = "norm_suspension_travel_fr",     type = "float32" },
      { name = "norm_suspension_travel_rl",     type = "float32" },
      { name = "norm_suspension_travel_rr",     type = "float32" },
      { name = "tire_slip_ratio_fl",            type = "float32" },
      { name = "tire_slip_ratio_fr",            type = "float32" },
      { name = "tire_slip_ratio_rl",            type = "float32" },
      { name = "tire_slip_ratio_rr",            type = "float32" },
      { name = "wheel_rotation_speed_fl",       type = "float32" },
      { name = "wheel_rotation_speed_fr",       type = "float32" },
      { name = "wheel_rotation_speed_rl",       type = "float32" },
      { name = "wheel_rotation_speed_rr",       type = "float32" },
      { name = "wheel_on_rumble_strip_fl",      type = "int32"   },
      { name = "wheel_on_rumble_strip_fr",      type = "int32"   },
      { name = "wheel_on_rumble_strip_rl",      type = "int32"   },
      { name = "wheel_on_rumble_strip_rr",      type = "int32"   },
      { name = "wheel_in_puddle_fl",            type = "float32" },
      { name = "wheel_in_puddle_fr",            type = "float32" },
      { name = "wheel_in_puddle_rl",            type = "float32" },
      { name = "wheel_in_puddle_rr",            type = "float32" },
      { name = "surface_rumble_fl",             type = "float32" },
      { name = "surface_rumble_fr",             type = "float32" },
      { name = "surface_rumble_rl",             type = "float32" },
      { name = "surface_rumble_rr",             type = "float32" },
      { name = "tire_slip_angle_fl",            type = "float32" },
      { name = "tire_slip_angle_fr",            type = "float32" },
      { name = "tire_slip_angle_rl",            type = "float32" },
      { name = "tire_slip_angle_rr",            type = "float32" },
      { name = "tire_combined_slip_fl",         type = "float32" },
      { name = "tire_combined_slip_fr",         type = "float32" },
      { name = "tire_combined_slip_rl",         type = "float32" },
      { name = "tire_combined_slip_rr",         type = "float32" },
      { name = "suspension_travel_meters_fl",   type = "float32" },
      { name = "suspension_travel_meters_fr",   type = "float32" },
      { name = "suspension_travel_meters_rl",   type = "float32" },
      { name = "suspension_travel_meters_rr",   type = "float32" },
      { name = "car_ordinal",                   type = "int32"   },
      { name = "car_class",                     type = "int32"   },
      { name = "car_performance_index",         type = "int32"   },
      { name = "drivetrain_type",               type = "int32"   },
      { name = "num_cylinders",                 type = "int32"   },
      { name = "car_group",                     type = "uint32"  },
      { name = "smashable_vel_diff",            type = "float32" },
      { name = "smashable_mass",                type = "float32" },
      { name = "position_x",                    type = "float32" },
      { name = "position_y",                    type = "float32" },
      { name = "position_z",                    type = "float32" },
      { name = "speed",                         type = "float32" },
      { name = "power",                         type = "float32" },
      { name = "torque",                        type = "float32" },
      { name = "tire_temp_fl",                  type = "float32" },
      { name = "tire_temp_fr",                  type = "float32" },
      { name = "tire_temp_rl",                  type = "float32" },
      { name = "tire_temp_rr",                  type = "float32" },
      { name = "boost",                         type = "float32" },
      { name = "fuel",                          type = "float32" },
      { name = "distance_traveled",             type = "float32" },
      { name = "best_lap",                      type = "float32" },
      { name = "last_lap",                      type = "float32" },
      { name = "current_lap",                   type = "float32" },
      { name = "current_race_time",             type = "float32" },
      { name = "lap_number",                    type = "uint16"  },
      { name = "race_position",                 type = "uint8"   },
      { name = "accel",                         type = "uint8"   },
      { name = "brake",                         type = "uint8"   },
      { name = "clutch",                        type = "uint8"   },
      { name = "handbrake",                     type = "uint8"   },
      { name = "gear",                          type = "uint8"   },
      { name = "steer",                         type = "int8"    },
      { name = "normalized_driving_line",       type = "int8"    },
      { name = "normalized_ai_brake_difference", type = "int8"   },
      { bits = 8, omit = true },  # byte 323: padding
    ]

###############################################################################
#                                 OUTPUTS                                     #
###############################################################################

# 1) Durable storage for history / session comparison.
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"

# 2) Real-time push to Grafana Live. Telegraf POSTs line protocol to the Live
#    push endpoint; dashboards subscribe to channel stream/forza/forza over WS.
[[outputs.http]]
  url = "http://grafana:3000/api/live/push/forza"
  method = "POST"
  data_format = "influx"
  username = "${GRAFANA_ADMIN_USER}"
  password = "${GRAFANA_ADMIN_PASSWORD}"
  [outputs.http.headers]
    Content-Type = "text/plain; charset=utf-8"
