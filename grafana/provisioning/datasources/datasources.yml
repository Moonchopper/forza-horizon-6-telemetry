apiVersion: 1

datasources:
  # Historical / session queries.
  - name: InfluxDB
    uid: influxdb-forza
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
    secureJsonData:
      token: ${INFLUX_TOKEN}

  # Real-time push channels (Grafana Live). Built-in datasource, declared here
  # so dashboards can reference it by a stable uid.
  - name: -- Grafana --
    uid: grafana
    type: datasource
